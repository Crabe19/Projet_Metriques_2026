<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Design Anthracite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fond gris sombre texturé */
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2c2c2c 0%, #121212 100%);
            padding: 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 450px;
            /* Gris très sombre pour la carte */
            background: #242424;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: #ffffff;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 600;
            color: #fff;
        }

        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #666;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Contact</h2>
        <p class="subtitle">Laissez un message à notre attention</p>
        
        <form onsubmit="event.preventDefault();">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" placeholder="Dupont" required>
            </div>

            <div class="form-group">
                <label>Prénom</label>
                <input type="text" placeholder="Jean" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Votre message ici..." required></textarea>
            </div>

            <button type="submit">Envoyer le message</button>
        </form>
    </div>

</body>
</html>
