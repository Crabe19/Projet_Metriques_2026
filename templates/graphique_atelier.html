<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Atelier - Qualité de l'Air Paris</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #121212; color: white; margin: 40px; }
    #chart_div { 
      width: 100%; 
      height: 550px; 
      background: #1e1e1e; 
      border-radius: 15px; 
      padding: 20px;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; color: #a3ffb4; font-weight: 300; }
    .legend-info { text-align: center; color: #888; margin-top: 15px; font-size: 0.85rem; }
  </style>
</head>

<body>
  <h1>Atelier : Indice de Qualité de l'Air (EAQI)</h1>
  <div id="chart_div"></div>
  <p class="legend-info">Plus l'indice est bas, plus l'air est pur. Données prévisionnelles sur 7 jours.</p>

  <script type="text/javascript">
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(drawAirQualityChart);

    async function drawAirQualityChart() {
      try {
        // API Air Quality : Coordonnées de Paris, Forecast 7 jours, Indice Européen (european_aqi)
        const url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=48.8534&longitude=2.3488&hourly=european_aqi&forecast_days=7";
        
        const response = await fetch(url);
        if (!response.ok) throw new Error("Erreur de récupération des données");
        
        const json = await response.json();

        const data = new google.visualization.DataTable();
        data.addColumn('datetime', 'Date/Heure');
        data.addColumn('number', 'Indice Qualité Air');

        const rows = [];
        for (let i = 0; i < json.hourly.time.length; i++) {
          rows.push([
            new Date(json.hourly.time[i]), 
            json.hourly.european_aqi[i]
          ]);
        }
        data.addRows(rows);

        const options = {
          title: 'Évolution de la pollution atmosphérique (EAQI)',
          titleTextStyle: { color: '#FFF', fontSize: 16 },
          backgroundColor: 'transparent',
          colors: ['#2ecc71'], // Vert pour un aspect "écologique"
          areaOpacity: 0.3,
          legend: { position: 'none' },
          hAxis: { 
            title: '7 prochains jours',
            textStyle: { color: '#666' },
            gridlines: { color: '#222' }
          },
          vAxis: { 
            title: 'Indice EAQI',
            textStyle: { color: '#666' },
            gridlines: { color: '#222' },
            minValue: 0
          },
          // Format SteppedAreaChart : Graphique en escalier
          chartArea: { width: '85%', height: '75%' }
        };

        // Utilisation du format SteppedAreaChart
        const chart = new google.visualization.SteppedAreaChart(document.getElementById('chart_div'));
        chart.draw(data, options);

      } catch (error) {
        console.error(error);
        document.getElementById('chart_div').innerHTML = `<p style="text-align:center; padding-top:200px; color:red;">Erreur : ${error.message}</p>`;
      }
    }

    window.addEventListener('resize', drawAirQualityChart);
  </script>
</body>
</html>
